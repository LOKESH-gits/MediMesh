/* ---- Health Shadow Radar: robust baseline → z-score → EWMA + CUSUM per stream → corroboration fusion ---- */
function radarStream(arr){
 const base=arr.slice(0,9),med=median(base),mad=median(base.map(x=>Math.abs(x-med)))*1.4826;
 const sigma=Math.max(mad,.15*Math.max(med,1),1);
 const z=arr.map(x=>(x-med)/sigma);let e=z[0],c=0;
 const ew=z.map(v=>e=.5*v+.5*e),cs=z.map(v=>c=Math.max(0,c+v-.5));
 return{med,sigma,z,ew,cs,zLast:z[z.length-1],ewLast:ew[ew.length-1],csLast:cs[cs.length-1],pct:(mean(arr.slice(-3))/Math.max(med,.5)-1)*100};
}
function radarSyn(v,syn){
 const W={school:syn==='diarrhea'?.5:1,pharmacy:1.2,asha:1.3,clinic:1.5};
 const parts=SRC.map(src=>{const arr=DB.signals[v][syn][src],r=radarStream(arr);return{src,arr,r,w:W[src],score:clamp(Math.max(r.ewLast,r.csLast/5)/3.5,0,1)}});
 const wm=sum(parts.map(p=>p.score*p.w))/sum(parts.map(p=>p.w)),agree=parts.filter(p=>p.r.zLast>=2).length;
 const risk=Math.round(100*(.65*wm+.35*agree/4)),level=risk>=55?'high':risk>=28?'increasing':'normal';
 return{v,syn,parts,wm,agree,risk,level,pct:Math.round(clamp(mean(parts.map(p=>p.r.pct)),-100,300))};
}

/* ---- Federated village intelligence: local stats → clip → Laplace DP noise → pairwise-mask secure aggregation → FedAvg ---- */
function fedRound(eps,seedN){
 const R=rng(seedN),lap=b=>{const u=R()-.5;return-b*Math.sign(u)*Math.log(1-2*Math.abs(u))};
 const vs=DB.villages,tp=sum(vs.map(v=>v.pop)),n=vs.length;
 const local=vs.map(v=>({v,vec:SYN.map(s=>clamp(radarSyn(v.id,s).pct,-100,100))}));
 const noisy=local.map(l=>l.vec.map(x=>x+lap(12/eps)));
 const M=Array.from({length:n},()=>Array.from({length:n},()=>SYN.map(()=>(R()-.5)*2000)));
 const masked=noisy.map((vec,i)=>vec.map((x,k)=>{let w=x*vs[i].pop/tp;for(let j=0;j<n;j++){if(j>i)w+=M[i][j][k];if(j<i)w-=M[j][i][k]}return w}));
 const global=SYN.map((_,k)=>sum(masked.map(m=>m[k]))),truth=SYN.map((_,k)=>sum(local.map(l=>l.vec[k]*l.v.pop/tp)));
 return{local,noisy,masked,global,truth,eps,tp};
}

/* ---- AI Resource & Referral Optimizer: hard constraints + TOPSIS multi-criteria ranking ---- */
function topsis(rows,w,benefit){
 const k=w.length,norm=Array.from({length:k},(_,j)=>Math.sqrt(sum(rows.map(r=>r[j]**2)))||1);
 const V=rows.map(r=>r.map((x,j)=>x/norm[j]*w[j]));
 const best=Array.from({length:k},(_,j)=>{const c=V.map(r=>r[j]);return benefit[j]?Math.max(...c):Math.min(...c)});
 const worst=Array.from({length:k},(_,j)=>{const c=V.map(r=>r[j]);return benefit[j]?Math.min(...c):Math.max(...c)});
 return V.map(r=>{const dp=Math.sqrt(sum(r.map((x,j)=>(x-best[j])**2))),dm=Math.sqrt(sum(r.map((x,j)=>(x-worst[j])**2)));return dp+dm?dm/(dp+dm):.5});
}
const WPRESET={emergency:[.4,.15,.2,.1,.15],urgent:[.3,.15,.2,.15,.2],routine:[.15,.2,.2,.2,.25]};

 const sc=topsis(cand.map(c=>c.row),W,[false,true,true,true,true]);

 ranked.forEach(r=>{const why=[];why.push(`${SVC_L[service]} ${r.f.services[service]}`);why.push(`~${r.mins} min`);why.push(`${r.f.beds.free} beds free`);why.push(`${r.f.doctors.on} doctor${r.f.doctors.on===1?'':'s'} on duty`);why.push(`${r.f.medAvail}% medicines in stock`);r.why=why});

/* ---- Voice memory NLP: multilingual lexicon + number words + fuzzy village match ---- */
const LEX={fever:['fever','jwar','காய்ச்சல்','बुखार','জ্বর'],vomiting:['vomit','வாந்தி','उल्टी','বমি'],diarrhea:['diarrh','loose motion','வயிற்றுப்போக்கு','दस्त','ডায়রিয়া','পাতলা পায়খানা'],cough:['cough','இருமல்','खांसी','खाँसी','কাশি'],breath:['breath','மூச்சு','सांस','শ্বাস']};
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,'ஒன்று':1,'ஒரு':1,'இரண்டு':2,'மூன்று':3,'நான்கு':4,'ஐந்து':5,'ஆறு':6,'ஏழு':7,'எட்டு':8,'ஒன்பது':9,'பத்து':10,'एक':1,'दो':2,'तीन':3,'चार':4,'पांच':5,'पाँच':5,'छह':6,'छः':6,'सात':7,'आठ':8,'नौ':9,'दस':10,'এক':1,'দুই':2,'তিন':3,'চার':4,'পাঁচ':5,'ছয়':6,'সাত':7,'আট':8,'নয়':9,'দশ':10};
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function parseReport(text,vs){
 const raw=text.trim(),low=raw.toLowerCase();let village=null,best=9;
 vs.forEach(v=>{if(low.includes(v.name.toLowerCase())||raw.includes(v.ta.slice(0,-1))||(v.alt||[]).some(a=>raw.includes(a.slice(0,-1)))){village=v;best=0}});
 if(!village)low.split(/[^a-z]+/).filter(w=>w.length>3).forEach(w=>vs.forEach(v=>{const d=lev(w,v.name.toLowerCase());if(d<best&&d<=2){best=d;village=v}}));
 const clauses=raw.split(/,|;|\.|\band\b|மற்றும்|और|এবং/i).map(s=>s.trim()).filter(Boolean),entries=[];
 clauses.forEach(c=>{const cl=c.toLowerCase();let n=null;const dm=cl.match(/\d+/);if(dm)n=+dm[0];else for(const w of cl.split(/\s+/)){const k=w.replace(/[^\p{L}\p{M}]/gu,'');if(NUMW[k]){n=NUMW[k];break}}
  for(const[sym,words]of Object.entries(LEX))if(words.some(w=>cl.includes(w.toLowerCase())))entries.push({symptom:sym,count:n??1,guess:n==null});});
 const merged={};entries.forEach(e=>{merged[e.symptom]=merged[e.symptom]?{...merged[e.symptom],count:merged[e.symptom].count+e.count}:e});
 return{village,confidence:village?(best===0?'exact':'fuzzy'):'none',entries:Object.values(merged),raw};
}
const SYM2SYN={fever:'fever',vomiting:'diarrhea',diarrhea:'diarrhea',cough:'respiratory',breath:'respiratory'};

/* ---- Medicine verification: structured code + integrity checksum + trusted registry ---- */
function verifyMed(code){
 const c=code.trim().toUpperCase(),m=c.match(/^MM-([A-Z]{3})-([A-Z0-9]{4})-(\d{2})$/);
 if(!m)return{state:'unverified',msg:'Medicine information could not be verified.',why:'Code format not recognised. Enter the code printed near the batch number, or scan a supported QR.'};
 const good=batchCode(m[1],m[2]);
 if(good!==c)return{state:'unverified',msg:'Medicine information could not be verified.',why:'The code failed its integrity check — it may be mistyped or altered. Do not rely on this package until checked by a pharmacist.'};
 const r=DB.registry[c];if(!r)return{state:'unverified',msg:'Medicine information could not be verified.',why:'Code is well-formed but not present in the trusted registry available to this device.'};
 const med=medById(r.med);
 if(r.recalled)return{state:'recalled',msg:'Recall notice — do not use.',med,batch:r.batch,exp:r.exp,why:'This batch has been recalled. Return it to the pharmacist.'};
 if(r.exp<Date.now())return{state:'expired',msg:'Expired batch — do not use.',med,batch:r.batch,exp:r.exp,why:'The registry lists this batch as past its expiry date.'};
 return{state:'verified',msg:'Verified against the trusted registry.',med,batch:r.batch,exp:r.exp,why:'Batch and expiry match registry records.'};
}

/* ---- Rule-based triage (clinician-reviewed rule set v1) — screening support, never a diagnosis ---- */
function triage(list,durDays,person){
 const red=list.filter(s=>SYM.find(x=>x.k===s.k)?.red);let score=sum(list.map(s=>(SYM.find(x=>x.k===s.k)?.w||1)*s.sev));
 score+=durDays>=3?1.5:0;if(person&&(person.age<5||person.age>65)&&list.some(s=>s.k==='fever'))score+=1.5;score=Math.round(score*10)/10;
 const level=red.length||score>=9?'high':score>=5?'medium':'low';
 const flags=[];red.forEach(s=>flags.push(symL(s.k)+' is a red-flag symptom'));if(durDays>=3)flags.push('Symptoms lasting 3+ days');if(person&&(person.age<5||person.age>65))flags.push('Age group needs earlier review');
 const advice=level==='high'?'Seek in-person clinical review today. If breathing is difficult or the person is confused, use Emergency Help.':level==='medium'?'Your ASHA worker will review this within 24 hours. Keep hydrated and rest.':'Monitor at home. Your ASHA worker will check in. Report any worsening.';
 return{score,level,flags,advice};
}
const trendLabel=(t)=>{const l=t[t.length-1],p=t.length>2?t[t.length-3]:t[0];const lvl=l>=7?'high':l>=4?'medium':'low';return{lvl,label:l<p-1?'Improving':l>p+1?'Worsening':'Stable',score:l}};
function patientAI(p){
 const s=p.symptoms[p.symptoms.length-1],tr=trendLabel(p.trend);
 if(!s)return{text:'No active symptoms recorded.',level:'low'};
 const names=s.list.map(x=>symL(x.k).toLowerCase()).join(' and '),tri=triage(s.list,parseInt(s.dur)||1,p);
 const level=p.riskConfirmed?p.riskConfirmed.level:tr.lvl;return{text:`${cap(names)} for ${s.dur}. Trend: ${tr.label.toLowerCase()}. Current screening level: ${level}.${p.allergies.length?' Allergy on file: '+p.allergies.join(', ')+'.':''}`,level,tri};
}

 if(!e.roles.includes(user.role)){await audit(user,`DENIED ${name}`,'',false);throw new ApiErr(403,`Access denied: the ${ROLES[user.role].label} role cannot use ${name}`)}
 s.last=Date.now();const r=await e.fn({user},args);

 const orbit=[['ASHA',-.78,-.15],['Doctor',.4,-.72],['Patient',.78,.3],['Care',.1,.82]].map(([n,x,y])=>({n,x,y}));
 const pulses=[];let last=0;const sz=()=>{const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=cv.width=Math.max(300,r.width*d);H=cv.height=Math.max(300,r.height*d)};sz();new ResizeObserver(sz).observe(cv);
 const col={high:'#FF6B6B',increasing:'#F2B73E',normal:'#4ADE9A'};
 function frame(now){if(!document.body.contains(cv))return;const R=W/2,X=x=>W/2+x*R,Y=y=>H/2+y*R,ang=(now/4500)*Math.PI*2%(Math.PI*2);
  ctx.clearRect(0,0,W,H);const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,R);g.addColorStop(0,'rgba(20,90,95,.55)');g.addColorStop(1,'rgba(6,26,29,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,220,212,.16)';ctx.lineWidth=1.2;[.3,.6,.92].forEach(r=>{ctx.beginPath();ctx.arc(W/2,H/2,R*r,0,7);ctx.stroke()});ctx.beginPath();ctx.moveTo(W/2-R*.92,H/2);ctx.lineTo(W/2+R*.92,H/2);ctx.moveTo(W/2,H/2-R*.92);ctx.lineTo(W/2,H/2+R*.92);ctx.stroke();
  for(let i=0;i<46;i++){const a=ang-i*.018;ctx.strokeStyle=`rgba(80,230,220,${.28*(1-i/46)})`;ctx.lineWidth=R*.012;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(a)*R*.92,H/2+Math.sin(a)*R*.92);ctx.stroke()}
  ctx.strokeStyle='rgba(120,220,212,.14)';ctx.lineWidth=1;nodes.forEach(n=>{ctx.beginPath();ctx.moveTo(X(n.x),Y(n.y));ctx.lineTo(W/2,H/2);ctx.stroke()});orbit.forEach(o=>{ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(X(o.x),Y(o.y));ctx.stroke()});
  if(now-last>650){last=now;const weighted=nodes.flatMap((n,i)=>Array(1+Math.round(n.risk/25)).fill(i)),i=weighted[Math.floor(Math.random()*weighted.length)];pulses.push({from:[nodes[i].x,nodes[i].y],to:[0,0],t:0,c:col[nodes[i].lvl],next:1});if(Math.random()<.6){const o=orbit[Math.floor(Math.random()*4)];pulses.push({from:[0,0],to:[o.x,o.y],t:0,c:'#F2A93B',next:0})}}
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=.012;if(p.t>=1){pulses.splice(i,1);continue}const x=p.from[0]+(p.to[0]-p.from[0])*p.t,y=p.from[1]+(p.to[1]-p.from[1])*p.t;ctx.fillStyle=p.c;ctx.globalAlpha=1-p.t*.4;ctx.beginPath();ctx.arc(X(x),Y(y),R*.014,0,7);ctx.fill();ctx.globalAlpha=1}
  nodes.forEach(n=>{const a=Math.atan2(n.y,n.x),d=Math.abs(((ang-a+Math.PI*3)%(Math.PI*2))-Math.PI),glow=clamp(1-Math.abs(((ang-a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2))/1.2,0,1),rad=R*(.022+n.risk/100*.02);ctx.fillStyle=col[n.lvl];ctx.globalAlpha=.25+glow*.5;ctx.beginPath();ctx.arc(X(n.x),Y(n.y),rad*2.4,0,7);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(X(n.x),Y(n.y),rad,0,7);ctx.fill();ctx.fillStyle='rgba(230,243,241,.85)';ctx.font=`${R*.05}px Figtree,sans-serif`;ctx.textAlign='center';ctx.fillText(n.n,X(n.x),Y(n.y)+rad+R*.06)});
  orbit.forEach(o=>{ctx.fillStyle='#0B3B40';ctx.strokeStyle='#F2A93B';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(o.x),Y(o.y),R*.06,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#FCE7BE';ctx.font=`600 ${R*.05}px Figtree,sans-serif`;ctx.textAlign='center';ctx.fillText(o.n,X(o.x),Y(o.y)+R*.11)});
  ctx.fillStyle='#35B8B2';ctx.beginPath();ctx.arc(W/2,H/2,R*.07,0,7);ctx.fill();ctx.fillStyle='#04221F';ctx.font=`700 ${R*.06}px Bricolage Grotesque,sans-serif`;ctx.textAlign='center';ctx.fillText('AI',W/2,H/2+R*.022);
  requestAnimationFrame(frame)}

}

 const route=s.filter(e=>e.ambId&&e.status!=='completed').flatMap(e=>{const am=a.find(x=>x.id===e.ambId),f=facBy(e.facId);return[{a:ptOf(am),b:ptOf(e)},{a:ptOf(e),b:ptOf(f)}]});
 const freeA=a.filter(x=>x.status==='available');
 return`${pageHead(t('requests'),'Assign the nearest available ambulance and move each case through its stages.')}<div class="split"><div class="col">${s.length?s.map(e=>{const opts=[...freeA].sort((x,y)=>hav(x,e)-hav(y,e));return`<div class="card"><div class="row"><h3>${vName(e.village)}</h3><span class="sp"></span>${statusChip(e.status)}</div><div class="sm">${esc(e.who)} · ${esc(e.note)} · ${ago(e.t)}</div>${e.status==='requested'?`<form data-form="assign" class="grid g3 mt"><input type="hidden" name="id" value="${e.id}"><div class="field"><label>Ambulance (nearest first)</label><select name="amb">${opts.map(x=>`<option value="${x.id}">${x.id} · ETA ${etaTo(x,e)} min</option>`).join('')||'<option value="">None available</option>'}</select></div><div class="field"><label>Destination</label><select name="fac">${DB.facilities.filter(f=>f.services.emergency!=='unavailable').sort((x,y)=>hav(x,e)-hav(y,e)).map(f=>`<option value="${f.id}">${f.short} · ${f.er.free} ER bays</option>`).join('')}</select></div><div class="field"><label>&nbsp;</label><button class="btn danger" type="submit" ${opts.length?'':'disabled'}>Dispatch</button></div></form>`:`<div class="row mt"><span class="sm">${e.ambId} → ${esc(facBy(e.facId)?.short||'')}${e.eta?' · ETA '+e.eta+' min':''}</span><span class="sp"></span>${e.status!=='completed'?`<button class="btn sm role" data-act="sosstep" data-id="${e.id}">Advance stage</button>`:''}</div>`}</div>`}).join(''):`<div class="card">${empty('truck','No emergency requests')}</div>`}</div><div class="card"><h3>Route status</h3>${mapSVG({rows:neutralRows(),route,click:false})}</div></div>`};

PAGES.officer.command=async()=>{
 const[geo,al,amb]=await Promise.all([api('geo.metrics'),api('alert.list'),api('amb.list')]),act=al.filter(a=>a.status!=='resolved'),syn=ST.syn||'all',ashas=DB.users.filter(u=>u.role==='asha'&&u.active);
 const feed=[];for(const a of act.slice(0,3)){const rs=await api('geo.radar',{v:a.v});const r=rs.find(x=>x.syn===a.syn);r.parts.forEach(p=>{if(p.r.zLast>=1.5)feed.push(`${vName(a.v)} · ${SRC_L[p.src]}: ${Math.round(p.r.med)} → ${p.arr[13]} ${SRC_U[p.src]}`)})}
 return`${pageHead(t('command'),'What is happening, what needs attention, what to do next.',`<button class="btn role" data-go="#/officer/loop">${ic('refresh')} Run system loop</button>`)}
 <div class="grid g3 mb"><div class="card stat k bad"><span class="n">${act.length}</span><span class="l">Active risk signals</span></div><div class="card stat k warn"><span class="n">${geo.filter(g=>g.stock==='LOW').length}</span><span class="l">Villages with low stock</span></div><div class="card stat k info"><span class="n">${sum(geo.map(g=>g.waiting))}</span><span class="l">Patients waiting for a doctor</span></div><div class="card stat k ok"><span class="n">${amb.filter(a=>a.status==='available').length}/${amb.length}</span><span class="l">Ambulances available</span></div></div>
 <div class="split mb"><div class="card"><div class="row mb"><h3 style="margin:0">Village health map</h3><span class="sp"></span>${['all',...SYN].map(s=>`<button class="tab ${syn===s?'on':''}" data-act="synsel" data-s="${s}">${s==='all'?'All':SYN_L[s]}</button>`).join('')}</div>${mapSVG({rows:geo,syn})}<div class="legend mt"><span>🟢 Normal</span><span>🟡 Increasing risk</span><span>🔴 High risk</span><span>${ic('lock')} Aggregated only</span></div></div><div class="card"><h3>Health Shadow Radar</h3>${scope(geo)}</div></div>
 <div class="card mb"><h3>Early-warning alerts ${aiTag()}</h3>${act.length?act.map(a=>`<div class="item" style="align-items:flex-start"><span class="dotc ${a.level}" style="margin-top:8px"></span><div class="meta"><b>${vName(a.v)} — ${SYN_L[a.syn]}</b> ${lvChip(a.level)} ${a.status!=='open'?chip(a.status,'info'):''}<div class="sm">${t('riskSignal')} · score ${a.risk} · ${a.agree} of 4 sources</div></div><div class="row"><button class="btn sm" data-go="#/officer/radar/${a.v}">Evidence</button>${a.status==='open'?`<button class="btn sm" data-act="alack" data-id="${a.id}">Acknowledge</button>`:''}<select class="sel" id="as_${a.id}" style="height:34px" aria-label="ASHA worker">${ashas.map(u=>`<option value="${u.id}" ${u.villages.includes(a.v)?'selected':''}>${u.name}</option>`).join('')}</select><button class="btn sm role" data-act="alassign" data-id="${a.id}">Assign ASHA</button><button class="btn sm ghost" data-act="alclose" data-id="${a.id}">Resolve</button></div></div>`).join(''):empty('check','No active signals')}</div>
 ${feed.length?`<div class="card mb"><h3>Community signals (combined)</h3>${feed.map(x=>`<div class="item">${ic('radar')}<span>${esc(x)}</span></div>`).join('')}</div>`:''}
 <h2 class="mb">Village digital twins</h2><div class="grid mb">${geo.map(g=>`<div class="card vtwin" data-go="#/officer/radar/${g.v.id}"><div class="row"><h3>${g.v.name}</h3><span class="sp"></span><span class="xs mut">pop ${g.v.pop}</span></div>${SYN.map(s=>`<div class="item" style="padding:5px 0"><span class="dotc ${g.syn[s].level}"></span><span class="meta">${SYN_L[s]} risk</span><b class="sm risk-${g.syn[s].level}">${{high:'HIGH',increasing:'MEDIUM',normal:'NORMAL'}[g.syn[s].level]}</b></div>`).join('')}<div class="row mt">${chip('Stock: '+g.stock,g.stock==='LOW'?'bad':g.stock==='WATCH'?'warn':'ok')}${chip('ASHA workload: '+g.workload,g.workload==='HIGH'?'bad':g.workload==='MEDIUM'?'warn':'ok')}${chip('Ambulance: '+g.amb+(g.ambEta?' · '+g.ambEta+' min':''),g.amb==='AVAILABLE'?'ok':'bad')}</div></div>`).join('')}</div>${accessCard('officer')}`};

PAGES.officer.federated=async()=>`${pageHead(t('federated'),'Each village learns locally. Only protected numbers leave the village.')}<div class="grid g2 mb"><div class="card"><h3>Privacy budget</h3><div class="field"><label>ε (epsilon): <b id="epsv">2.0</b> — lower = more privacy, more noise</label><input type="range" id="eps" min="0.5" max="5" step="0.5" value="2" oninput="$('#epsv').textContent=(+this.value).toFixed(1)"></div><button class="btn role" data-act="fedrun">${ic('share')} Run federated round</button></div><div class="card"><h3>What happens</h3><ol class="sm"><li><b>Local:</b> each village computes its trend on its own data.</li><li><b>Clip + noise:</b> values are bounded and Laplace noise is added.</li><li><b>Mask:</b> pairwise random masks hide each village’s number.</li><li><b>Aggregate:</b> masks cancel in the sum; the district sees only the weighted average.</li></ol></div></div><div id="fedout"></div>`;
ACT.fedrun=async()=>{const r=await api('fed.round',{eps:+$('#eps').value,seed:Date.now()%99999}),o=$('#fedout'),f=v=>(v>0?'+':'')+v.toFixed(0)+'%',st=n=>`<div class="note ok mb">${ic('check')}<div>${n}</div></div>`;
 const tbl=(cols,rows)=>`<div class="scroll"><table class="tbl"><thead><tr><th>Village</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
 o.innerHTML='<div class="card">'+st('1 · Local computation — stays inside each village')+tbl(SYN.map(s=>SYN_L[s]),r.local.map(l=>`<tr><td><b>${l.v.name}</b> ${chip('stays local','info','lock')}</td>${l.vec.map(x=>`<td>${f(x)}</td>`).join('')}</tr>`).join(''))+'</div>';await sleep(900);
 o.innerHTML+='<div class="card mt">'+st(`2 · Clipped to ±100 and Laplace noise added (ε = ${r.eps})`)+tbl(SYN.map(s=>SYN_L[s]),r.noisy.map((n,i)=>`<tr><td>${r.local[i].v.name}</td>${n.map(x=>`<td>${f(x)}</td>`).join('')}</tr>`).join(''))+'</div>';await sleep(900);
 o.innerHTML+='<div class="card mt">'+st('3 · Masked values actually sent — meaningless on their own')+tbl(SYN.map(s=>SYN_L[s]),r.masked.map((n,i)=>`<tr><td>${r.local[i].v.name}</td>${n.map(x=>`<td class="xs">${x.toFixed(1)}</td>`).join('')}</tr>`).join(''))+'</div>';await sleep(900);
 o.innerHTML+=`<div class="card mt"><h3>4 · District intelligence ${chip('Privacy-preserving community intelligence','ok','shield')}</h3><div class="grid g3">${SYN.map((s,i)=>`<div class="stat card flat"><span class="n ${r.global[i]>15?'risk-high':r.global[i]>5?'risk-increasing':'risk-normal'}">${f(r.global[i])}</span><span class="l">${SYN_L[s]} (population-weighted)</span><span class="xs mut">without noise: ${f(r.truth[i])} · error ${Math.abs(r.global[i]-r.truth[i]).toFixed(1)} pts</span></div>`).join('')}</div><p class="sm mt">The server never saw an individual village’s true number or any patient identity.</p></div>`};
PAGES.officer.loop=async()=>{const s=await api('loop.state'),ST_=[['Community signals','Signals from schools, pharmacies, ASHA, clinics',()=>1,'officer','command'],['Health Shadow Radar','Baseline + z-score + EWMA fusion',()=>s.alerts>0,'officer','radar'],['AI pattern analysis','Corroboration across sources',()=>s.alerts>0,'officer','radar'],['Early warning','Alert raised — verification required',()=>s.alerts>0,'officer','command'],['ASHA review','Household verification task',()=>s.sigDone>0,'asha','today'],['Patient verification','Patient confirms or corrects',()=>s.pendingVerify===0,'patient','home'],['Doctor / provider','Consultation',()=>s.seen>0,'doctor','queue'],['Approved prescription','Doctor issues, pharmacist verifies',()=>s.rxTotal>0,'doctor','queue'],['Medication reminder','Reminders from the prescription only',()=>s.pendingDoses>0,'patient','medicines'],['Adherence tracking','Taken / missed logged',()=>s.doses>0,'patient','medicines'],['Continuous monitoring','Trend re-scored',()=>1,'patient','home'],['Food / health guidance','Clinician-approved',()=>s.guidance>0,'doctor','queue'],['Follow-up','Scheduled',()=>s.fu>0,'patient','home'],['New health data','Fresh signals re-enter the radar',()=>s.alerts>0,'asha','voice'],['Community intelligence','Federated, privacy-preserving',()=>1,'officer','federated']];
 const cur=ST_.findIndex(x=>!x[2]());
 return`${pageHead(t('loop'),'Inject a simulated outbreak-like signal, then follow it through the whole care loop. Every step is real and changes stored data.')}<div class="card mb"><h3>1 · Inject a simulated surge</h3><div class="grid g3"><div class="field"><label>Village</label><select id="sv">${DB.villages.map(v=>`<option value="${v.id}" ${v.id==='v5'?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="field"><label>Signal</label><select id="ss">${SYN.map(x=>`<option value="${x}">${SYN_L[x]}</option>`).join('')}</select></div><div class="field"><label>Strength ×<span id="skv">3</span></label><input type="range" id="sk" min="1" max="6" step="0.5" value="3" oninput="$('#skv').textContent=this.value"></div></div><div class="row"><button class="btn role" data-act="siminj">${ic('zap')} Inject &amp; run radar</button><button class="btn ghost" data-act="simreset">Reset signals</button></div><div id="simout" class="mt"></div></div>
 <div class="card"><h3>2 · Follow the loop</h3><div class="col">${ST_.map((x,i)=>`<div class="item"><span class="chip ${x[2]()?'ok':i===cur?'info':''}">${x[2]()?'✓':i+1}</span><div class="meta"><b>${x[0]}</b><span class="xs mut">${x[1]}</span></div>${x[3]!=='officer'&&i>=cur-1?`<button class="btn sm" data-act="loopgo" data-r="${x[3]}" data-p="${x[4]}">Do as ${ROLES[x[3]].label}</button>`:''}</div>`).join('')}</div></div>`};
ACT.siminj=async()=>{const r=await api('sim.inject',{v:$('#sv').value,syn:$('#ss').value,k:+$('#sk').value});savedToast();$('#simout').innerHTML=`<div class="note ${r.level==='normal'?'ok':'warn'}">${ic('radar')}<div><b>${vName(r.v)} · ${SYN_L[r.syn]}: risk ${r.risk} (${LV_L[r.level]})</b><br>${r.level==='normal'?'Below alert thresholds — try a larger multiplier.':t('riskSignal')+'. ASHA task and officer/doctor notifications created.'}</div></div>`;setTimeout(refreshView,1400)};
ACT.simreset=async()=>{await api('sim.reset');savedToast();refreshView()};
ACT.loopgo=async el=>{await ACT.demo({dataset:{r:el.dataset.r}});go(`#/${el.dataset.r}/${el.dataset.p}`)};

PAGES.admin.users=async()=>{const[u,s]=await Promise.all([api('adm.users'),api('adm.stats')]);return`${pageHead(t('users'),'Every change here is written to the audit chain.')}<div class="grid g3 mb"><div class="card stat k info"><span class="n">${s.users}</span><span class="l">Accounts</span></div><div class="card stat k ok"><span class="n">${s.sessions}</span><span class="l">Active sessions</span></div><div class="card stat k bad"><span class="n">${s.denied}</span><span class="l">Denied attempts logged</span></div></div><div class="card scroll"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${u.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="sm">${esc(x.email)}</td><td><select class="sel" data-act="role" data-id="${x.id}" aria-label="Role for ${esc(x.name)}" ${x.id===curUser().id?'disabled':''}>${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===x.role?'selected':''}>${r.label}</option>`).join('')}</select></td><td>${x.active?chip('Active','ok'):chip('Disabled','bad')}</td><td>${x.id===curUser().id?'<span class="xs mut">you</span>':`<button class="btn sm ${x.active?'':'role'}" data-act="toggle" data-id="${x.id}" data-a="${x.active?0:1}">${x.active?'Disable':'Enable'}</button>`}</td></tr>`).join('')}</tbody></table></div>${accessCard('admin')}`};

PAGES.admin.permissions=async()=>{const roles=Object.keys(ROLES),groups={};Object.keys(EP).forEach(k=>{(groups[k.split('.')[0]]??=[]).push(k)});
 return`${pageHead(t('permissions'),'Generated from the live API table — the same table the server checks on every request.')}<div class="card mb"><h3>${ic('lock')} RBAC tester</h3><div class="row"><select id="tr" class="sel">${roles.map(r=>`<option value="${r}">${ROLES[r].label}</option>`).join('')}</select><select id="te" class="sel">${Object.keys(EP).map(k=>`<option>${k}</option>`).join('')}</select><button class="btn role" data-act="probe">Test access</button></div><div id="pr" class="mt"></div><div class="mt sm">URL tampering test (you are an administrator): <a href="#/doctor/queue">#/doctor/queue</a> · <a href="#/patient/home">#/patient/home</a> — both are refused.</div></div><div class="card scroll"><table class="tbl"><thead><tr><th>Endpoint</th>${roles.map(r=>`<th title="${ROLES[r].label}" style="color:${ROLES[r].color}">${r.slice(0,4)}</th>`).join('')}</tr></thead><tbody>${Object.entries(groups).map(([g,ks])=>`<tr><td colspan="${roles.length+1}" class="b mut xs" style="background:var(--s2)">${g}</td></tr>`+ks.map(k=>`<tr><td class="xs">${k}</td>${roles.map(r=>`<td>${EP[k].roles.includes(r)?'<b style="color:var(--ok)">✓</b>':'<span class="mut">·</span>'}</td>`).join('')}</tr>`).join('')).join('')}</tbody></table></div>`};
ACT.probe=async()=>{const r=$('#tr').value,e=$('#te').value,ok=probe(r,e);await audit(curUser(),`RBAC probe: ${r} → ${e} = ${ok?'ALLOWED':'DENIED'}`,'',true);$('#pr').innerHTML=`<div class="note ${ok?'ok':'bad'}">${ic(ok?'check':'x')}<div><b>${ok?'200 Allowed':'403 Denied'}</b> — ${ROLES[r].label} ${ok?'can':'cannot'} call <code>${e}</code>.</div></div>`};
PAGES.admin.audit=async()=>{const a=await api('adm.audit'),v=ST.chain;return`${pageHead(t('audit'),'Every entry is hash-chained to the one before it. Editing history breaks the chain.',`<button class="btn role" data-act="chain">${ic('shield')} Verify chain</button><button class="btn ghost" data-act="tamper">Simulate tampering</button>`)}${v?`<div class="note ${v.ok?'ok':'bad'} mb">${ic(v.ok?'check':'alert')}<div>${v.ok?`Chain intact — ${v.n} entries verified with SHA-256.`:`Chain BROKEN at entry “${esc(v.bad.action)}”. ${v.n} entries checked.`}${v.ok?'':' <button class="btn sm mt" data-act="reseal">Re-seal chain</button>'}</div></div>`:''}<div class="card"><input data-filter="#aud" placeholder="Filter by user, action, role…" aria-label="Filter audit log" style="max-width:340px" class="mb"><div class="scroll" id="aud"><table class="tbl"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Hash</th></tr></thead><tbody>${a.slice(0,150).map(e=>`<tr data-s="${esc((e.who+e.action+e.role+e.target).toLowerCase())}"><td class="xs">${fmtDT(e.t)}</td><td><b class="sm">${esc(e.who)}</b><div class="xs mut">${e.role}</div></td><td>${e.ok?'':chip('denied','bad')} ${esc(e.action)}</td><td class="xs mut">${e.hash.slice(0,10)}…</td></tr>`).join('')}</tbody></table></div></div>`};
ACT.chain=async()=>{ST.chain=await api('adm.verify');refreshView()};
ACT.tamper=async()=>{await api('adm.tamper');toast('An old log entry was edited — now verify the chain','warn');refreshView()};
ACT.reseal=async()=>{await api('adm.reseal');ST.chain=await api('adm.verify');toast('Chain re-sealed (this action is logged)');refreshView()};
PAGES.admin.system=async()=>{const[s,q]=await Promise.all([api('adm.stats'),api('sync.list')]);return`${pageHead(t('system'),'Health of the prototype platform.')}<div class="grid g3 mb"><div class="card stat k info"><span class="n">${s.audit}</span><span class="l">Audit entries</span></div><div class="card stat k ${s.queued?'warn':'ok'}"><span class="n">${s.queued}</span><span class="l">Records waiting to sync</span></div><div class="card stat k ok"><span class="n">${s.consent.analytics}/${s.consent.n}</span><span class="l">Patients consenting to analytics</span></div></div><div class="grid g2"><div class="card"><h3>Secure synchronisation queue</h3><div class="row mb"><button class="btn" data-act="net">${ic(NET.online?'wifi':'wifioff')} ${NET.online?'Simulate offline':'Go online'}</button><button class="btn role" data-act="syncnow">Sync now</button></div>${q.length?q.slice(0,12).map(x=>`<div class="item"><div class="meta"><span class="sm">${esc(x.desc)}</span><span class="xs mut">${fmtT(x.t)}</span></div>${x.status==='synced'?chip(t('synced'),'ok','check'):chip(t('waiting'),'warn','clock')}</div>`).join(''):empty('refresh','Nothing queued')}</div><div class="card"><h3>Security controls</h3><ul class="sm"><li>Passwords stored as salted SHA-256 hashes</li><li>Sessions expire after 30 min idle</li><li>5 failed sign-ins → 60 s lockout</li><li>Server-side role check on every API call</li><li>Row-level filters (assignment + consent)</li><li>Hash-chained, tamper-evident audit log</li><li>Input validation on every write</li></ul><button class="btn danger mt" data-act="reset">Reset demo data</button></div></div>`};
/* ================= BOOT ================= */
(async()=>{await initDB();applyPrefs();NET.online=navigator.onLine!==false;render()})();
